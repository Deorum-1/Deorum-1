<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Sokunbi Oluwaferanmi, Software developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e75b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <path id="wave" d="M0 30 Q 125 0 250 30 T 500 30 T 750 30 T 1000 30 T 1250 30 T 1500 30 T 1750 30 T 2000 30 V 80 H 0 Z"/>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>

  <!-- floating glow dots -->
  <circle cx="120" cy="60" r="6" fill="#fff" opacity=".25">
    <animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="80" r="9" fill="#fff" opacity=".2">
    <animate attributeName="cy" values="80;55;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="40" r="4" fill="#fff" opacity=".3">
    <animate attributeName="cy" values="40;60;40" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- text -->
  <g text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#fff">
    <text x="500" y="108" font-size="48" font-weight="700" opacity="0">
      Sokunbi Oluwaferanmi
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="152" font-size="22" opacity="0">
      Full-Stack Developer  |  APIs &amp; Web Apps
      <animate attributeName="opacity" from="0" to="0.95" dur="1.2s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="500" y="184" font-size="15" opacity="0" letter-spacing="2">
      REACT  •  NEXT.JS  •  TYPESCRIPT  •  NODE.JS
      <animate attributeName="opacity" from="0" to="0.8" dur="1.2s" begin="1.1s" fill="freeze"/>
    </text>
  </g>

  <!-- animated waves along the bottom -->
  <g transform="translate(0 196)">
    <use href="#wave" fill="#fff" opacity=".15">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="12s" repeatCount="indefinite"/>
    </use>
    <use href="#wave" fill="#fff" opacity=".25" y="12">
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </use>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
